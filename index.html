<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="合同サークル「すいかパレット」の公式サイトです。">
  <title>すいかパレット</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: #fffaf7;
      color: #29332d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 143, 154, 0.18), transparent 32rem),
        radial-gradient(circle at 80% 80%, rgba(99, 180, 124, 0.18), transparent 32rem),
        #fffaf7;
    }

    main {
      width: min(90vw, 720px);
      padding: 64px 32px;
      text-align: center;
    }

    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #ff8793;
      border: 8px solid #63b47c;
      box-shadow: 0 12px 30px rgba(41, 51, 45, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 5rem);
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    p {
      margin: 20px 0 0;
      color: #68736d;
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    footer {
      margin-top: 64px;
      color: #969f9a;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>すいかパレット</h1>
    <p>Website coming soon.</p>
    <footer>Suika Palette</footer>
  </main>
</body>
</html>
